name: HardwareWatchdog CI

# Manual on-demand execution only (zero automatic runner minute consumption)
on:
  workflow_dispatch:

jobs:
  validate:
    name: PowerShell & Python Validation
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate PowerShell Script Syntax
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $errors += $parseErrors
            }
          }
          if ($errors.Count -gt 0) { exit 1 }

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python Scripts
        run: |
          python -m compileall -q .
