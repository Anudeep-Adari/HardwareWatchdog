name: HardwareWatchdog CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: PowerShell & Python Validation
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate PowerShell Script Syntax
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $errors += $parseErrors
              Write-Error "Syntax error in $($_.Name): $($parseErrors | Out-String)"
            } else {
              Write-Host "Validated $($_.Name): Syntax OK" -ForegroundColor Green
            }
          }
          if ($errors.Count -gt 0) { exit 1 }

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python Scripts
        run: |
          python -m compileall -q .
